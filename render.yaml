services:
  # ── Backend ──────────────────────────────────────────────
  - type: web
    name: smartkrishi-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: DATA_GOV_API_KEY
        sync: false          # optional — mandi falls back to static data

  # ── Frontend ─────────────────────────────────────────────
  - type: web
    name: smartkrishi-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
